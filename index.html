<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="/logoofficial.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Student Service Portal</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UI Portal" />
    <meta name="description" content="The Student Portal provides dashboard access for students to access their purchased courses offered by Unknown IITians." />
    <meta name="author" content="Unknown IITians" />

    <meta property="og:title" content="ssp.unknowniitians.live" />
    <meta property="og:description" content="The Student Portal provides dashboard access for students to access their purchased courses offered by Unknown IITians." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logoofficial.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logoofficial.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
    <script src="https://meet.jit.si/external_api.js"></script>

    <!-- First-paint splash (shows before JS loads; React replaces it seamlessly) -->
    <style>
      #ui-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
      #ui-splash .wrap{display:flex;flex-direction:column;align-items:center;animation:uiSplashIn .5s ease-out both}
      #ui-splash img{width:64px;height:64px;display:block}
      #ui-splash .meter{position:relative;width:190px;height:6px;border-radius:4px;margin-top:28px;background:#e5e7eb;overflow:hidden}
      #ui-splash .meter i{position:absolute;top:0;left:0;height:100%;width:45%;border-radius:4px;background:#9ca3af;animation:uiMeter 1.6s ease-in-out infinite}
      #ui-splash .icons{display:flex;gap:7px;margin-top:36px}
      #ui-splash .chip{width:32px;height:32px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:#94a3b8}
      #ui-splash .chip svg{width:21px;height:21px;display:block;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      @keyframes uiSplashIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
      @keyframes uiMeter{0%{transform:translateX(-110%)}100%{transform:translateX(245%)}}
    </style>
  </head>

  <body>
    <div id="root">
      <div id="ui-splash">
        <div class="wrap">
          <img src="/logoofficial.png" alt="Unknown IITians" width="64" height="64" />
          <div class="meter"><i></i></div>
          <div class="icons">
            <span class="chip"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h6L18 8.8v11.7H6.5z"/><path d="M12.5 3.5v5.3H18"/><text x="12.2" y="17.6" font-size="5.6" font-weight="800" fill="#fff" stroke="none" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">PDF</text></svg></span>
            <span class="chip"><svg viewBox="0 0 24 24"><path d="M9.6 7.7a1 1 0 0 1 1.5-.87l5.8 3.6a1 1 0 0 1 0 1.72l-5.8 3.6A1 1 0 0 1 9.6 15z" fill="#fff" stroke="none"/></svg></span>
            <span class="chip"><svg viewBox="0 0 24 24"><path d="M7 3.5h6L17.5 8v12.5H7z"/><path d="M13 3.5V8h4.5"/></svg></span>
            <span class="chip"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.7" r="6.4"/><path d="M12 13.7V9.8"/><path d="M9.6 3.6h4.8"/><path d="M12 3.6v3"/></svg></span>
            <span class="chip"><svg viewBox="0 0 24 24"><path d="M5 5.5h4.5v13H5zM11 6.2l6-.8 1.2 12.6-6 .8z"/></svg></span>
            <span class="chip"><svg viewBox="0 0 24 24"><path d="M5 19l.9-3.8L15.4 5.7a1.8 1.8 0 0 1 2.5 0l.4.4a1.8 1.8 0 0 1 0 2.5L8.8 18.1 5 19z"/><path d="M13.8 7.3l2.9 2.9"/></svg></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
