    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UI Portal" />
    <meta name="description" content="The Student Portal provides dashboard access for students to access their purchased courses offered by Unknown IITians." />

    <meta property="og:title" content="ssp.unknowniitians.live" />

    <script src="https://meet.jit.si/external_api.js"></script>

    <!-- First-paint splash (shows before JS loads; React replaces it seamlessly) -->
    <style>
      #ui-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
      #ui-splash .wrap{display:flex;flex-direction:column;align-items:center;animation:uiSplashIn .5s ease-out both}
      #ui-splash .stage{position:relative;width:220px;height:220px}
      #ui-splash .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;animation:uiCycle 7.5s ease-in-out infinite}
      #ui-splash .stage img:nth-child(2){animation-delay:1.5s}
      #ui-splash .stage img:nth-child(3){animation-delay:3s}
      #ui-splash .stage img:nth-child(4){animation-delay:4.5s}
      #ui-splash .stage img:nth-child(5){animation-delay:6s}
      @keyframes uiCycle{0%{opacity:0;transform:scale(.96)}4%{opacity:1;transform:none}18%{opacity:1;transform:none}22%{opacity:0;transform:scale(1.02)}100%{opacity:0}}
      #ui-splash .meter{position:relative;width:190px;height:6px;border-radius:4px;margin-top:14px;background:#e5e7eb;overflow:hidden}
      #ui-splash .meter i{position:absolute;top:0;left:0;height:100%;width:45%;border-radius:4px;background:#9ca3af;animation:uiMeter 1.6s ease-in-out infinite}
      @keyframes uiSplashIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
      @keyframes uiMeter{0%{transform:translateX(-110%)}100%{transform:translateX(245%)}}
    </style>
  </head>

  <body>
    <div id="root">
      <div id="ui-splash">
        <div class="wrap">
          <div class="stage" aria-label="Loading">
            <img src="/art/my-learning.png" alt="" /><img src="/art/lectures.png" alt="" /><img src="/art/notes.png" alt="" /><img src="/art/dpp.png" alt="" /><img src="/art/ui-ki-padhai.png" alt="" />
          </div>
          <div class="meter"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
